[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2excel"
version = "0.1.0"
description = "Extract tables from text-based PDFs into Excel (XLSX) or CSV"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["pdfplumber>=0.10", "pandas>=1.5", "openpyxl>=3.0"]

[project.optional-dependencies]
web = ["streamlit>=1.30"]
camelot = ["camelot-py>=0.11"]
dev = ["pytest", "pytest-cov", "reportlab>=4"]

[project.scripts]
pdf2excel = "pdf2excel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
